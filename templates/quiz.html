{% extends "base.html" %}
{% block content %}

<div class="container container-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>{{quiz.title}}</h2>
            <p>{{quiz.description}}</p>
            <form method="POST">
                {% csrf_token %}
                {% for item in question_data %}
                <div>
                    <h3>
                        {{forloop.counter}}
                        {{item.question.question}}
                    </h3>
                    {% for option in item.options %}
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="question_{item.question.id}" value="{{option.id}}" id="radioDefault1" required>
                        <label class="form-check-label" for="radioDefault1">
                            {{option.option}}
                        </label>
                    </div>
                    <!-- <label>
                        <input type="radio" , name="question_{item.question.id}" , value="{{option.id}}" required>
                        {{option.option}}

                    </label> -->
                    <br>
                    {% endfor %}
                </div>
                {% endfor %}
                <a href="{% url 'take_
                quiz' quiz.id %}" class="btn btn-primary">Take Quiz</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
