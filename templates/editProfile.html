{% extends 'base.html' %}

{% block content %}
<br>
<div class="container container-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="POST">
                <h2>Edit Profile</h2><br>
                {% csrf_token %}
                {{form.as_p}}
                <br>
                <input class="btn btn-success" type="submit" value="Save">
            </form> 
            <br><br>
            <button class="btn btn-success"><a href="{% url 'dashboard' %}">Back to Dashboard</a></button>
        </div>
    </div>
</div>

{% endblock %}
