{% extends "base.html" %}
{% block content %}

<div class="container container-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <table class="table">
                <tr>
                    <th>Serial No:</th>
                    <th>Quiz Question</th>
                </tr>
                {% for question in questions %}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{question.question}}</td>

                </tr>

                <tr>
                    {% for option in question.options.all %}
                    <td>({{forloop.counter}})</td>
                    <td>
                        
                            <input class="form-check-input" type="radio" name="{{options.option}}" id="{{questions.id}}">
                        
                    </td>
                    <td>{{option.option}}</td>
                    

                    {% endfor %}

                </tr>

                {% endfor %}

            </table>
            <center><input class="btn btn-success" type="submit" value="Submit"></center>
        </div>
    </div>
</div>

{% endblock %}
