{% extends "base.html" %}
{% block content %}

<div class="container container-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <table class="table">
                <tr>
                    <th>S1</th>
                    <th>Quiz Question</th>
                </tr>
                {% for question in questions %}
                <tr>
                    <td>{{forloop.counter}}</td>
                    <td>{{question.question}}</td>
                </tr>
                <tr>
                    {% for option in question.options.all %}
                    <td>{{forloop.counter}}</td>
                    <td>{{option.option}}</td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>
</div>

{% endblock %}
